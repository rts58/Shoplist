<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#f2f2f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Shoplist" />
<title>Shoplist</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<script>
  // Resolve the color theme before first paint. The app's appearance choice is
  // "system" | "light" | "dark" (see the Appearance setting in the Manage
  // sheet). "system" follows the OS via prefers-color-scheme. Runs in <head> so
  // the correct theme is in place before the body renders (no light flash on
  // dark devices). The main script reuses window.__shoplistTheme for the UI.
  (function () {
    var root = document.documentElement;
    var KEY = "shoplist.theme";
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var themeColorMeta = document.querySelector('meta[name="theme-color"]');
    // The browser-chrome hint must be a literal color (var() is invalid in a
    // meta tag), so we mirror the app's --bg for the resolved theme.
    var CHROME = { light: "#f2f2f7", dark: "#000000" };
    function readChoice() {
      var c;
      try { c = localStorage.getItem(KEY); } catch (e) { c = null; }
      return (c === "light" || c === "dark" || c === "system") ? c : "system";
    }
    function apply() {
      var resolved = readChoice() === "system" ? (mq.matches ? "dark" : "light") : readChoice();
      root.setAttribute("data-theme", resolved);
      if (themeColorMeta) themeColorMeta.setAttribute("content", CHROME[resolved]);
    }
    apply();
    // matchMedia change events differ by engine; guard both.
    if (typeof mq.addEventListener === "function") {
      mq.addEventListener("change", apply);
    } else if (typeof mq.addListener === "function") {
      mq.addListener(apply);
    }
    // Expose to the main script so the Appearance setting stays in sync.
    window.__shoplistTheme = {
      key: KEY,
      choice: readChoice(),
      resolved: root.getAttribute("data-theme"),
      apply: apply,
      setChoice: function (c) {
        if (c !== "light" && c !== "dark" && c !== "system") c = "system";
        try { localStorage.setItem(KEY, c); } catch (e) {}
        window.__shoplistTheme.choice = c;
        apply();
      }
    };
  })();
</script>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --surface-2: #f7f7fa;
    --text: #1c1c1e;
    --text-2: #6b6b70;
    --text-3: #a0a0a8;
    --separator: #e8e8ee;
    --accent: #34c759;
    --accent-press: #2bb04c;
    --accent-soft: #e7f8ec;
    --on-list: #007aff;
    --danger: #ff3b30;
    --on-accent: #fff;
    --link: #0a84ff;
    --bg-2: #e9e9ee;
    --topbar-bg: rgba(242,242,247,.85);
    --tabbar-bg: rgba(255,255,255,.88);
    --scrim: rgba(0,0,0,.35);
    --toast-bg: rgba(28,28,30,.92);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.05);
    --shadow-md: 0 4px 14px rgba(0,0,0,.08);
    --shadow-lg: 0 0 40px rgba(0,0,0,.1);
    --radius: 14px;
    --tabbar-h: 56px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  /* Dark theme. The light values above are the default; this block overrides
     only the color variables when <html data-theme="dark"> is set (see the
     theme script in <head>). Values are the iOS system dark palette so the
     app matches the native app. Non-color vars (--radius, --tabbar-h, --safe-*)
     are inherited from :root and left untouched. */
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --text: #ffffff;
    --text-2: #98989d;
    --text-3: #636366;
    --separator: #38383a;
    --accent: #30d158;
    --accent-press: #28b84c;
    --accent-soft: #16301f;
    --on-list: #0a84ff;
    --danger: #ff453a;
    --on-accent: #ffffff;
    --link: #0a84ff;
    --bg-2: #1c1c1e;
    --topbar-bg: rgba(29,29,31,.85);
    --tabbar-bg: rgba(22,22,23,.88);
    --scrim: rgba(0,0,0,.55);
    --toast-bg: rgba(44,44,46,.95);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
    --shadow-md: 0 4px 14px rgba(0,0,0,.45);
    --shadow-lg: 0 0 40px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.4;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input { font: inherit; color: inherit; }
  .app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; background: var(--bg); }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--topbar-bg);
    backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
    padding-top: var(--safe-top); border-bottom: 1px solid var(--separator);
  }
  .topbar-inner { padding: 10px 16px 12px; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .brand .dot { color: var(--accent); }

  .stores { display: flex; align-items: center; gap: 8px; }
  .stores-row { display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .stores-row::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm);
    font-size: 15px; font-weight: 600; color: var(--text-2); white-space: nowrap;
    transition: background .15s, color .15s, transform .08s;
  }
  .pill:active { transform: scale(.96); }
  .pill.active { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-md); }
  .pill.add { color: var(--accent); border: 1.5px dashed var(--accent); background: transparent; box-shadow: none; }
  .pill .x { font-size: 16px; line-height: 1; opacity: .5; margin-left: 2px; }
  .pill.active .x { opacity: .8; color: var(--on-accent); }

  .icon-btn { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-2); background: transparent; transition: background .15s; }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn.hidden { display: none; }
  .brand-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .store-tools { flex: 0 0 auto; display: flex; align-items: center; }
  .search-wrap { position: relative; margin-top: 12px; }
  .search-wrap.hidden { display: none; }
  @media (orientation: portrait) {
    .search-wrap { flex: 1 1 auto; min-width: 0; max-width: 50%; }
  }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
  .search { width: 100%; padding: 10px 34px 10px 38px; border-radius: 12px; border: 1px solid var(--separator); background: var(--surface); font-size: 16px; box-shadow: var(--shadow-sm); outline: none; }
  .search:focus { border-color: var(--accent); }
  .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; background: var(--separator); display: none; align-items: center; justify-content: center; color: var(--text-2); font-size: 14px; }
  .search-clear.show { display: inline-flex; }


  /* The whole category (header + items + footer) is one continuous card: a
     single surface background, a single shadow, and rounded corners applied to
     the section so the hairline separators inside read as one unified card.
     overflow:hidden clips to the rounded corners; item content never overflows
     its row so this is safe. */
  .cat { margin-bottom: 8px; background: var(--surface); box-shadow: var(--shadow-sm); border-radius: var(--radius); overflow: hidden; }
  /* Item rows are NOT individual cards — they sit flush inside their card
     container (.cat on the Stores tab, .list-card on My List / Purchased),
     separated only by hairline borders. */
  .cat-body .item { border-top: 1px solid var(--separator); }
  .cat-body .item:first-child { border-top: none; }
  /* Category header + items + footer are all inside the single .cat card (see
     above). The header/foot no longer need their own backgrounds, shadows, or
     corner radii — the section's rounded corners + overflow:hidden clip them,
     so the hairline separators read as one unified card. */
  .cat-header { display: flex; align-items: center; padding: 0 14px; }
  .cat-head { display: flex; align-items: center; gap: 10px; padding: 10px 2px; text-align: left; background: transparent; flex: 1; min-width: 0; }
  .cat-head .chev { color: var(--text-3); transition: transform .2s; flex: 0 0 auto; }

  .content { flex: 1; padding: 16px; padding-bottom: calc(16px + var(--tabbar-h) + var(--safe-bottom)); }
  /* "⋯" action button at the right of a row. Tapping opens the row's menu. */
  .menu-btn { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--text-3); transition: background .15s; }
  .menu-btn:active { background: var(--surface-2); }
  .cat-title { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -.2px; min-width: 0; }
  /* The item body sits flush against the header (no gap) so header + items +
     footer read as one continuous card inside the .cat section. */
  .cat-body { display: none; margin-top: 0; }
  .cat-body.open { display: block; }
  .cat-head.open .chev { transform: rotate(90deg); }
  .cat-foot { display: flex; border-top: 1px solid var(--separator); }
  .cat-add { flex: 1; padding: 9px 16px; font-size: 15px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .cat-add:active { background: var(--surface-2); }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 16px; position: relative; }
  .item .name { flex: 1; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .item-tag { font-size: 12px; font-weight: 600; color: var(--text-3); margin-left: 8px; }
  .item.on .name { color: var(--text-3); text-decoration: line-through; }
  .check { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--separator); display: inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
  .check svg { opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .item.on .check { background: var(--accent); border-color: var(--accent); }
  .item.on .check svg { opacity: 1; transform: scale(1); }
  /* Items screen: an item that's on My List (done) shows a filled BLUE box and
     normal, non-struck-through text. Scoped to .cat so the My List screen
     (.list-card) keeps its own green/dimmed styling. */
  .cat .item.on .check { background: var(--on-list); border-color: var(--on-list); }
  .cat .item.on .name { color: var(--text); text-decoration: none; }
  /* My List: purchased rows are visually distinct — dimmed, struck through.
     Scoped to .list-card so the Items (Stores) screen is unaffected. */
  .list-card .item { transition: background .15s; }
  .list-card .item:active { background: var(--surface-2); }
  .list-card .item .name { transition: color .15s, opacity .15s; }
  .list-card .item .item-tag { transition: opacity .15s; }
  /* Only purchased rows are dimmed. To Buy rows (done, not purchased) keep
     full opacity and a normal, empty-looking checkbox. */
  .list-card .item.purchased { opacity: .6; }
  /* .purchased .name has higher specificity than the later
     .list-card .item .name { text-decoration: none } reset, so the
     line-through wins for purchased rows. */
  .list-card .item.purchased .name { color: var(--text-3); text-decoration: line-through; }
  /* Every My List item is done, so the global .item.on rule would fill all
     checkboxes green. Override in .list-card: To Buy rows get an empty box,
     Purchased rows keep the green checked box. */
  .list-card .item .check { background: transparent; border-color: var(--separator); }
  .list-card .item .check svg { opacity: 0; transform: scale(.6); }
  .list-card .item.purchased .check { background: var(--accent); border-color: var(--accent); }
  .list-card .item.purchased .check svg { opacity: 1; transform: scale(1); }

  .empty { text-align: center; color: var(--text-3); padding: 48px 20px; font-size: 15px; }
  .empty .big { font-size: 40px; margin-bottom: 12px; }

  .list-group { margin-bottom: 20px; }
  .list-group-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px; }
  .list-group-head.center { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .list-group-head.center .list-group-title { justify-self: start; }
  .list-group-head.center .list-send { justify-self: center; }
  .list-group-head.center .list-share { justify-self: end; }
  .list-group-title { font-size: 15px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .6px; }
  .list-send { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
  /* Up/down reorder arrows on a store row in the Manage sheet. The two arrows
     sit side by side to the left of the store name. */
  .store-move { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2px; }
  .store-move button { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); background: transparent; transition: background .15s; }
  .store-move button:active { background: var(--surface-2); }
  .store-move button:disabled { opacity: .3; }
  .list-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
  .list-card .item { border-top: 1px solid var(--separator); }
  .list-card .item:first-child { border-top: none; }
  .list-card .item .name { text-decoration: none; color: var(--text); }

  .list-share { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: none; border-radius: 10px; background: var(--accent); color: var(--on-accent); cursor: pointer; box-shadow: var(--shadow-sm); transition: background .15s, transform .08s; }
  .list-share:active { background: var(--accent-press); transform: scale(.94); }



  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--tabbar-bg); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-top: 1px solid var(--separator); display: flex; z-index: 40; max-width: 640px; margin: 0 auto; }
  .tab { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3); font-size: 11px; font-weight: 600; }
  .tab svg { width: 24px; height: 24px; }
  /* Only the *active* tab is highlighted: a subtle pill behind it (full-bleed,
     no margin so the layout is unchanged) plus the accent color. Inactive tabs
     stay flat on the bar. No :hover/:active background, so nothing lingers
     after a tap. */
  .tab.active { color: var(--accent); background: var(--accent-soft); border-radius: 12px; }
  /* Keyboard-only focus ring; mouse/touch taps never show it. */
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tab .badge { position: absolute; margin-top: -22px; margin-left: 20px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: none; align-items: center; justify-content: center; }
  .tab .badge.show { display: flex; }

  .modal-backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: none; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
  .modal-backdrop.show { display: flex; }
  .sheet { width: 100%; max-width: 640px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 20px calc(20px + var(--safe-bottom)); animation: slideUp .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--separator); margin: 6px auto 14px; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 700; text-align: center; }
  .sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; text-align: center; background: var(--surface-2); }
  .btn:active { opacity: .8; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.danger { background: var(--surface-2); color: var(--danger); }
  .btn.outline { background: transparent; border: 1px solid var(--separator); color: var(--text); }
  /* Destructive actions get a visual gap from the other buttons so Delete is
     never adjacent to Edit/Move — it wraps to its own row, 12px below. */
  .btn.danger { margin-top: 12px; }
  /* Uppercase section headers inside a sheet (e.g. STORES / BACKUP). */
  .sheet-section { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-3); margin: 18px 0 8px; }
  .sheet-section:first-child { margin-top: 0; }
  /* Small grey footer line at the bottom of a sheet (e.g. version + GitHub). */
  .sheet-footer { text-align: center; font-size: 12px; color: var(--text-3); margin: 12px 0 2px; }
  .sheet-footer a { color: var(--accent); text-decoration: none; }
  .sheet .field { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--separator); background: var(--surface-2); font-size: 16px; outline: none; }
  .sheet .field:focus { border-color: var(--accent); }
  /* Segmented control (iOS-style) for the Appearance setting. */
  .segmented { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
  .segmented button { flex: 1; padding: 9px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-2); background: transparent; transition: background .15s, color .15s; }
  .segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 20px + var(--safe-bottom)); transform: translateX(-50%) translateY(20px); background: var(--toast-bg); color: var(--on-accent); padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 80; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 80%; text-align: center; display: flex; align-items: center; gap: 14px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast-msg { flex: 1; min-width: 0; }
  .toast-action { flex: 0 0 auto; background: none; border: none; color: var(--link); font-size: 14px; font-weight: 700; padding: 0; cursor: pointer; }
  .toast-action:active { opacity: .7; }

  .add-category-row { width: 100%; border: 1.5px dashed var(--separator); border-radius: var(--radius); box-shadow: none; background: transparent; padding: 14px 16px; color: var(--accent); }

  @media (min-width: 700px) { .app { box-shadow: var(--shadow-lg); } body { background: var(--bg-2); } }
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">Shoplist<span class="dot">.</span></div>
        <div class="brand-actions">
          <button class="icon-btn" id="searchBtn" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </div>
        <div class="search-wrap" id="searchWrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="search" id="search" type="search" placeholder="Search items" autocomplete="off" enterkeyhint="search" />
          <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
        </div>
      </div>
      <div class="stores" id="stores"></div>
    </div>
  </header>

  <main class="content" id="content"></main>


  <nav class="tabbar">
    <button class="tab active" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1Z"/><path d="m9 14 2 2 4-4"/></svg>
      <span>My List</span>
      <span class="badge" id="listBadge">0</span>
    </button>
    <button class="tab" data-tab="stores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Items</span>

          if (typeof d.activeStore !== "number" || d.activeStore < 0 || d.activeStore >= d.stores.length) d.activeStore = 0;

          return d;
        }

    return seedData();

    if (action) {
      toastEl.querySelector(".toast-action").onclick = () => { action.fn(); dismissToast(); };
    }
    toastEl.classList.add("show");
    toastTimer = setTimeout(dismissToast, 5000);
  }
  function dismissToast() {
    clearTimeout(toastTimer);
    toastEl.classList.remove("show");
  }

  function matchesQuery(item) {
    if (!query) return true;
    return item.name.toLowerCase().includes(query);
  }

  // Alphabetical comparator (localeCompare with numeric:true so "Apple 2" sorts
  // before "Apple 10"). Used to sort items A–Z; the underlying array is never
  // reordered, so storage order stays stable (items are always added at the end).
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });

  // The search box only exists on the Stores tab. On the My List tab we hide it
  // and clear any in-flight query so the list is never filtered.
  function updateSearchVisibility() {
    const show = state.tab === "stores";
    searchWrap.classList.toggle("hidden", !show);
    // The search icon button is redundant next to the visible search box, so we
    // hide it on the Stores tab and keep it on My List (to jump to Stores).
    searchBtn.classList.toggle("hidden", show);
    if (!show) {
      query = "";
      searchInput.value = "";
      searchClear.classList.remove("show");
    }
  }

  // ---- render: stores pills ----
  function renderStores() {
    let pills = "";
    state.stores.forEach((s, i) => {
      const active = i === state.activeStore ? " active" : "";
      pills += `<button class="pill${active}" data-store="${i}">${esc(s.name)}</button>`;
    });
    pills += `<button class="pill add" data-addstore="1">${PLUS_SVG}Add store</button>`;
    // Pills scroll horizontally in .stores-row; the manage button is pinned to
    // the right edge (margin-left:auto) and never scrolls away.
    storesEl.innerHTML = `<div class="stores-row">${pills}</div>` +
      `<div class="store-tools"><button class="icon-btn" data-manage="1" aria-label="Settings sheet">${MANAGE_SVG}</button></div>`;
  }

  // ---- render: a single item row ----
  function itemRow(item, ctx) {
    // The store item's checkbox is the single source of truth:
    //  - Stores tab: checking "selects" it (adds it to My List).
    //  - My List tab: checking "purchases" it (moves it to Purchased).
    const on = item.done ? " on" : "";
    // My List: a purchased item is visually distinct (dimmed + struck through).
    // The .purchased class drives the dimming/grey/line-through. The .on class
    // (item.done) still drives the checkbox fill — every My List item is done,
    // so To Buy rows show a green checked box and Purchased rows the same.
    const purchased = item.purchased ? " purchased" : "";
    const tag = item.cat ? `<span class="item-tag">${esc(item.cat)}</span>` : "";
    // A trailing "⋯" button opens the row's Edit / Delete menu. It's shown on
    // every item row. ctx is the category object (Stores tab) or the string
    // "list" (My List tab) — both get a menu.
    const menu = `<button class="menu-btn" data-itemmenu="${item.id}" aria-label="Item menu">${DOTS_SVG}</button>`;
    // Items sit inside a card container (.cat on the Stores tab, .list-card on
    // My List / Purchased) that provides the surface background + single shadow,
    // so each row needs no card of its own — just the hairline separators.
    // The row itself carries data-toggle so tapping anywhere on it (not just the
    // checkbox) toggles the item. The delegated handler's closest() finds the
    // innermost match, so the checkbox and the ⋯ menu button keep their own
    // behavior (toggle / open menu) and don't double-fire.
    return `<div class="item${on}${purchased}" data-item="${item.id}" data-toggle="${item.id}">
      <button class="check" data-toggle="${item.id}" aria-label="Toggle">${CHECK_SVG}</button>
      <span class="name">${esc(item.name)}${tag}</span>
      ${menu}
    </div>`;
  }

  // After adding an item, scroll so the newly-added item and the "Add item"
  // row beneath it are both visible, fully ABOVE the fixed tab bar.
  //
  // Why this is fiddly: closing the sheet releases the on-screen keyboard, which
  // animates the layout viewport back to full height over a few hundred ms. If
  // we measure *during* that animation (a fixed setTimeout guess, which is what
  // the earlier versions did), window.innerHeight / the element rects are still
  // inflated to the keyboard-shrunk viewport, so the computed scroll lands
  // several rows too low — worst for categories further down the list.
  //
  // So instead of a guessed delay we re-measure and re-scroll every animation
  // frame until the keyboard has actually settled (the visual viewport stops
  // changing and the body height stabilizes). We anchor the measurement to the
  // *visual* viewport (the true rendered viewport, not the layout one) and
  // scroll the newly-added item so its bottom rests a small gap above the tab
  // bar, with the "Add item" row sitting right beneath it.
  function recenterAddItemRow(catId) {
    const vv = window.visualViewport;
    let lastH = -1, lastBodyH = -1, stable = 0, tries = 0;

    function measure() {
      const catEl = document.querySelector(`.cat[data-cat="${catId}"]`);
      if (!catEl) return;
      const foot = catEl.querySelector(".cat-foot");
      const lastItem = catEl.querySelector(".cat-body .item:last-of-type");
      const target = lastItem || (foot ? foot.querySelector(".cat-add") : null) || catEl;
      if (!target) return;

      // The page is the scroll container (the .content element is flex:1, not
      // overflow:auto). Use the document's scrolling element.
      const scroller = document.scrollingElement || document.documentElement;

      // True rendered viewport height. With the keyboard open, visualViewport
      // is the shrunk height; once it closes it equals the layout height.
      const vh = vv ? vv.height : window.innerHeight;

      // Visible bottom of the page, in viewport coordinates (0..vh).
      const pageBottom = (vv ? vv.offsetTop : 0) + vh;

      const tRect = target.getBoundingClientRect();
      const tabbar = document.querySelector(".tabbar");
      const tabTop = tabbar ? tabbar.getBoundingClientRect().top : pageBottom;
      const visibleBottom = Math.min(pageBottom, tabTop); // keep clear of tab bar

      // Scroll so the target's bottom sits a small gap above the visible bottom.
      const GAP = 8;
      let desired = scroller.scrollTop + (tRect.bottom - visibleBottom) + GAP;
      // Clamp to the maximum scrollable position so we never overshoot.
      const maxScroll = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
      desired = Math.max(0, Math.min(desired, maxScroll));

      scroller.scrollTop = desired;

      // Detect that the keyboard has settled: the visual viewport and the page
      // height have both stopped changing across consecutive frames.
      const bodyH = document.body.scrollHeight;
      const changed = lastH !== vh || lastBodyH !== bodyH;
      lastH = vh; lastBodyH = bodyH;
      stable = changed ? 0 : stable + 1;
      tries++;

      // Keep going until settled (2 stable frames) or a hard safety cap.
      if (stable < 2 && tries < 40) requestAnimationFrame(measure);
    }

    // Small initial pause lets closeSheet() blur the field and start the
    // keyboard-dismiss, then we track it to rest on rAF (not a guessed delay).
    setTimeout(() => requestAnimationFrame(measure), 40);
  }

  // ---- render: active store (Stores tab) ----
  function renderStore() {
    const store = state.stores[state.activeStore];
    if (!store) {
      contentEl.innerHTML = `<div class="empty"><div class="big">🏪</div>No store selected.<br>Add a store to start.</div>`;
      return;
    }
    let html = "";
    let anyVisible = false;
    store.categories.forEach((cat) => {
      const items = cat.items.filter(matchesQuery);
      if (query && items.length === 0) return;
      anyVisible = true;
      // Normal view: default to expanded, but honor an explicit collapse the
      // user made (openCats[cat.id] === false). Under search: force expanded so
      // the matched item is always visible (the user can still collapse).
      const open = query ? true : (state.openCats[cat.id] !== false);
      // Items render A–Z (a sorted copy of the filtered set); storage order is untouched.
      let body = [...items].sort(byName).map((it) => itemRow(it, cat)).join("");
      if (!items.length) body = `<div class="empty" style="padding:20px">Nothing here yet.</div>`;
      // The header is a plain card: an expand button (chevron + title + count)
      // plus a trailing "⋯" button that opens the category's Edit / Delete menu.
      // The menu button is a SIBLING of the expand button, not nested inside it.
      const catHead = `<button class="cat-head${open ? " open" : ""}" data-togglecat="${cat.id}">
        ${CHEV_SVG}
        <span class="cat-title">${esc(cat.name)}</span>
      </button>
      <button class="menu-btn" data-catmenu="${cat.id}" aria-label="Category menu">${DOTS_SVG}</button>`;
      const catBody = `<div class="cat-body${open ? " open" : ""}">
        ${body}
        <div class="cat-foot"><button class="cat-add" data-additem="${cat.id}">${PLUS_SVG}Add item</button></div>
      </div>`;
      html += `<section class="cat" data-cat="${cat.id}">
        <div class="cat-header">${catHead}</div>
        ${catBody}
      </section>`;
    });
    if (!anyVisible) {
      html = `<div class="empty"><div class="big">🔍</div>${query ? "No items match your search." : "No categories yet. Add one below."}</div>`;
    }
    // Always show the add-category row so it works even for empty stores.
    html += `<button class="cat add-category-row" data-addcat="1">${PLUS_SVG}Add category</button>`;
    contentEl.innerHTML = html;
  }

  // ---- render: my list (List tab) ----
  function renderList() {
    // My List shows the items selected (checked) in the active store,
    // split into To buy (selected) and Purchased (purchased).
    const items = storeItems().filter((i) => i.done).filter(matchesQuery);
    const toBuy = items.filter((i) => !i.purchased);
    const purchased = items.filter((i) => i.purchased);
    if (items.length === 0) {
      contentEl.innerHTML = `<div class="empty"><div class="big">🧾</div>Your list is empty.<br>Select items in the ${esc(state.stores[state.activeStore]?.name || "active")} store to add them here.</div>`;
      return;
    }
    let html = "";
    if (toBuy.length) {
      html += `<div class="list-group">
        <div class="list-group-head center"><span class="list-group-title">To buy</span><span class="list-send">${toBuy.length} item${toBuy.length > 1 ? "s" : ""}</span><button class="list-share" data-sendall="1" aria-label="Text list via SMS"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button></div>
        <div class="list-card">${toBuy.map((i) => itemRow(i, "list")).join("") || ""}</div>
      </div>`;
    }
    if (purchased.length) {
      html += `<div class="list-group">
        <div class="list-group-head"><span class="list-group-title">Purchased</span><span class="list-send">${purchased.length}</span><button class="list-send" data-clear="1" style="margin-left:12px">Clear</button></div>
        <div class="list-card">${purchased.map((i) => itemRow(i, "list")).join("")}</div>
      </div>`;
    }
    if (!items.length && query) html += `<div class="empty"><div class="big">🔍</div>No items match your search.</div>`;
    contentEl.innerHTML = html;
  }

  function updateBadge() {
    const n = storeItems().filter((i) => i.done && !i.purchased).length;
    listBadge.textContent = n;
    listBadge.classList.toggle("show", n > 0);
  }

  function render() {
    updateSearchVisibility();
    renderStores();
    if (state.tab === "stores") renderStore();
    else renderList();
    updateBadge();
    tabs.forEach((t) => t.classList.toggle("active", t.dataset.tab === state.tab));
    save();
  }

  // ---- mutations ----
  function findStoreItem(id) {
    for (const store of state.stores) {
      for (const cat of store.categories) {
        const idx = cat.items.findIndex((i) => i.id === id);
        if (idx >= 0) return { store, cat, item: cat.items[idx], idx };
      }
    }
    return null;
  }

  function storeItems() {
    const out = [];
    const store = state.stores[state.activeStore];
    if (!store) return out;
    // Categories keep their manual (user-ordered) sequence; items within each
    // category are sorted A–Z. Sorting a copy keeps the stored order stable.
    store.categories.forEach((cat) => {
      [...cat.items].sort(byName).forEach((it) => {
        out.push({ ...it, store: store.name, cat: cat.name });
      });
    });
    return out;
  }

  function addItemToStore(catId, name) {
    const store = state.stores[state.activeStore];
    if (!store) return;
    const cat = store.categories.find((c) => c.id === catId);
    if (!cat) return;
    cat.items.push({ id: uid(), name, done: false });
    state.openCats[catId] = true;
    render();
    toast("Added " + name);
  }

  function toggleItem(id, ctx) {
    const s = findStoreItem(id);
    if (!s) return;
    if (ctx === "list") {
      // My List: checking marks the item as purchased (moves To buy → Purchased).
      s.item.purchased = !s.item.purchased;
    } else {
      // Stores: checking selects the item (adds it to My List).
      s.item.done = !s.item.done;
    }
    render();
  }

  function deleteItem(id, ctx) {
    const s = findStoreItem(id);
    if (!s) return;
    if (ctx === "list") {
      // My List: un-check the store item so it disappears from the list.
      s.item.done = false;
      s.item.purchased = false;
      render();
      toast("Removed from list");
    } else {
      s.cat.items.splice(s.idx, 1);
      render();
      toast("Item removed");
    }
  }

  function clearPurchased() {
    // Clear only the purchased items in the active store's list. Un-checking
    // them (done → false) drops them out of My List and back to an unselected
    // state in the store. Items still in "To buy" (done, not purchased) are
    // left untouched.
    const store = state.stores[state.activeStore];
    if (!store) return;
    let removed = 0;
    store.categories.forEach((cat) => {
      cat.items.forEach((it) => {
        if (it.purchased) { it.done = false; it.purchased = false; removed++; }
      });
    });
    render();
    toast(removed ? `Cleared ${removed} purchased item${removed > 1 ? "s" : ""}` : "Nothing to clear");
  }

  function addCategory(name) {
    const store = state.stores[state.activeStore];
    if (!store) return;
    store.categories.push({ id: uid(), name, items: [] });
    render();
    toast("Category added");
  }

  function renameItem(id, name) {
    const s = findStoreItem(id);
    if (!s) return;
    s.item.name = name;
    render();
    toast("Item updated");
  }

  function renameCategory(catId, name) {
    const store = state.stores[state.activeStore];
    if (!store) return;
    const cat = store.categories.find((c) => c.id === catId);
    if (!cat) return;
    cat.name = name;
    render();
    toast("Category updated");
  }

  function deleteCategory(catId) {
    const store = state.stores[state.activeStore];
    if (!store) return;
    const idx = store.categories.findIndex((c) => c.id === catId);
    if (idx < 0) return;
    const cat = store.categories[idx];
    const n = cat.items.length;
    if (n > 0 && !confirm(`Delete "${cat.name}" and its ${n} item${n > 1 ? "s" : ""}?`)) return;
    store.categories.splice(idx, 1);
    render();
    toast("Category removed");
  }

  function moveCategory(catId, dir) {
    const store = state.stores[state.activeStore];
    if (!store) return;
    const idx = store.categories.findIndex((c) => c.id === catId);
    if (idx < 0) return;
    const j = idx + dir; // dir is -1 (up) or 1 (down)
    if (j < 0 || j >= store.categories.length) return; // already at the edge
    const cats = store.categories;
    [cats[idx], cats[j]] = [cats[j], cats[idx]];
    render();
  }

  function moveStore(i, dir) {
    // Reorder the stores array (the single source of truth for store order).
    // The backup is the whole state blob, so the reordered array is exactly
    // what export/import round-trips — no separate order field needed.
    const j = i + dir; // dir is -1 (up) or 1 (down)
    if (j < 0 || j >= state.stores.length) return; // already at the edge
    const stores = state.stores;
    [stores[i], stores[j]] = [stores[j], stores[i]];
    // Re-render the store rows in place (no sheet teardown/re-animation, which
    // would jarringly replay the slide-up). render() also re-renders the header
    // pills and calls save(), so the new order persists and the backup matches.
    renderStoreRows();
    render();
  }

  function addStore(name) {
    state.stores.push({ id: uid(), name, categories: [] });
    state.activeStore = state.stores.length - 1;
    render();
    toast("Store added");
  }

  function renameStore(i, name) {
    if (!state.stores[i]) return;
    state.stores[i].name = name;
    render();
  }

  function deleteStore(i) {
    if (state.stores.length <= 1) { toast("You need at least one store"); return; }
    state.stores.splice(i, 1);
    if (state.activeStore >= state.stores.length) state.activeStore = Math.max(0, state.stores.length - 1);
    render();
    toast("Store removed");
  }

  // ---- modals ----
  let sheetOpen = false;

  // Anchor the sheet to the *visual* viewport so it sits just above the on-screen
  // keyboard. With `interactive-widget=resizes-content` the layout viewport shrinks
  // when the keyboard opens, but a `position: fixed; bottom: 0` sheet stays pinned
  // to the (now smaller) layout bottom — hidden behind the keyboard until the user
  // scrolls. Tracking the visual viewport keeps the field visible.
  function positionSheet() {
    const vv = window.visualViewport;
    if (!sheetOpen || !vv) return;
    backdrop.style.left = vv.offsetLeft + "px";
    backdrop.style.top = vv.offsetTop + "px";
    backdrop.style.width = vv.width + "px";
    backdrop.style.height = vv.height + "px";
  }
  function clearSheetPosition() {
    backdrop.style.left = backdrop.style.top = backdrop.style.width = backdrop.style.height = "";
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", positionSheet);
    window.visualViewport.addEventListener("scroll", positionSheet);
  }
  // Re-focus the sheet's first field. Used both on open and as a safety net
  // in case the mobile browser cancels a programmatic focus (common when the
  // keyboard opens at the same time and the browser reclaims focus).
  function focusSheetField() {
    const field = sheet.querySelector("input.field, textarea.field");
    if (!field) return;
    // preventScroll:false so the browser scrolls the freshly-focused field into
    // view (the sheet slides up). Guard against an already-focused field to
    // avoid a scroll jump / focus loop with the safety net below.
    if (document.activeElement === field) return;
    field.focus({ preventScroll: false });
    const len = field.value.length;
    try { field.setSelectionRange(len, len); } catch (e) {}
    // If the browser silently refused the synchronous focus (it happens on
    // mobile when a blur just preceded it, or when the keyboard opens at the
    // same instant), focus is not on the field. Retry on the next animation
    // frame — still inside the user-gesture window on mobile — so the keyboard
    // follows and the field is editable.
    requestAnimationFrame(() => {
      if (!sheetOpen) return;
      if (document.activeElement !== field) {
        try { field.focus({ preventScroll: true }); } catch (e) {}
        const l = field.value.length;
        try { field.setSelectionRange(l, l); } catch (e) {}
      }
    });
  }
  function openSheet(title, bodyHtml, actionsHtml) {
    // Swapping from one sheet to another: skip the blur, because we are about to
    // focus a fresh field in this same turn (see closeSheet's skipBlur note).
    if (sheetOpen) closeSheet(true);
    sheetOpen = true;
    sheet.innerHTML = `<div class="grab"></div><h3>${esc(title)}</h3>${bodyHtml}${actionsHtml || ""}`;
    backdrop.classList.add("show");
    positionSheet();
    // Focus the first field synchronously, *during* the tap that opened the
    // sheet. This keeps the programmatic focus within the user-gesture window,
    // so the keyboard opens and the sheet rises. (A setTimeout delay lets the
    // gesture expire and the browser cancels the focus — the sheet then never
    // appears. The focusin safety net below re-grabs focus if it is lost.)
    focusSheetField();
  }
  // `skipBlur` is used when we are about to immediately open a *new* sheet with
  // a fresh field (the ⋯ → Edit transition). On mobile, blurring a field and
  // then synchronously focusing another field in the same JS turn is refused by
  // the browser: it has already committed to dismissing the keyboard, so the new
  // focus is silently cancelled and the Edit sheet collapses (looking like a
  // Cancel). We therefore keep the old field focused across the swap and let the
  // new field's focus replace it in place — the keyboard stays up and the field
  // is editable. On a genuine close we still blur to release the keyboard.
  function closeSheet(skipBlur) {
    sheetOpen = false;
    backdrop.classList.remove("show");
    clearSheetPosition();
    if (skipBlur) return;
    const f = sheet.querySelector("input.field, textarea.field");
    if (f) { try { f.blur(); } catch (e) {} }
  }
  // Safety net: if focus is lost while the sheet is open (e.g. the keyboard
  // opening stole it, or the browser reclaims it after the open tap), move
  // focus back to the field. We focus with preventScroll:true here so the
  // visible sheet does not jump — it is already on screen.
  document.addEventListener("focusin", (e) => {
    if (!sheetOpen || !sheet.contains(e.target)) return;
    const field = sheet.querySelector("input.field:not([readonly]), textarea.field:not([readonly])");
    if (!field || field === e.target) return;
    if (document.activeElement !== field) {
      try { field.focus({ preventScroll: true }); } catch (err) {}
      const len = field.value.length;
      try { field.setSelectionRange(len, len); } catch (err) {}
    }
  });

  function openAddItem(catId) {
    openSheet("Add item",
      `<input class="field" id="f" placeholder="Item name" maxlength="60" />`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Add</button></div>`);
    sheet.querySelector('[data-act="save"]').onclick = () => {
      const v = sheet.querySelector("#f").value.trim();
      if (v) {
        addItemToStore(catId, v);
        closeSheet();
        recenterAddItemRow(catId);
      }
    };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    sheet.querySelector("#f").onkeydown = (e) => { if (e.key === "Enter") sheet.querySelector('[data-act="save"]').click(); };
  }

  function openEditItem(id) {
    const s = findStoreItem(id);
    if (!s) return;
    openSheet("Edit item",
      `<input class="field" id="f" value="${esc(s.item.name)}" placeholder="Item name" maxlength="60" />`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Save</button></div>`);
    sheet.querySelector('[data-act="save"]').onclick = () => {
      const v = sheet.querySelector("#f").value.trim();
      if (v) renameItem(id, v);
      closeSheet();
    };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    sheet.querySelector("#f").onkeydown = (e) => { if (e.key === "Enter") sheet.querySelector('[data-act="save"]').click(); };
  }

  function openItemMenu(id) {
    const s = findStoreItem(id);
    if (!s) return;
    openSheet("Item options",
      `<p style="text-align:center;color:var(--text-2);margin:4px 0 8px"><b>${esc(s.item.name)}</b></p>`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn" data-act="edit">Edit</button><button class="btn danger" data-act="del">Delete</button></div>`);
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    // Defer the swap to the next task. The Edit/Delete buttons below swap the
    // sheet's innerHTML; on a touch tap the browser dispatches the `click` event
    // *after* mousedown/mouseup, so a synchronous swap leaves a ghost click that
    // lands on the backdrop and immediately closes the freshly-opened sheet.
    // Waiting one tick lets that click finish against the original button first.
    sheet.querySelector('[data-act="edit"]').onclick = () => { setTimeout(() => { closeSheet(true); openEditItem(id); }, 0); };
    sheet.querySelector('[data-act="del"]').onclick = () => {
      // No confirm: deleting an item is low-risk and reversible. Delete now and
      // offer Undo via a toast that restores the item to its original spot.
      const store = s.store, cat = s.cat, idx = s.idx, item = s.item;
      deleteItem(id, "stores");
      setTimeout(closeSheet, 0);
      toast("Item deleted", { label: "Undo", fn: () => {
        cat.items.splice(idx, 0, item);
        render();
      }});
    };
  }

  function openCategoryMenu(catId) {
    const store = state.stores[state.activeStore];
    const cat = store && store.categories.find((c) => c.id === catId);
    if (!cat) return;
    openSheet("Category options",
      `<p style="text-align:center;color:var(--text-2);margin:4px 0 8px"><b>${esc(cat.name)}</b></p>`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Close</button><button class="btn" data-act="up">Move ↑</button><button class="btn" data-act="down">Move ↓</button><button class="btn" data-act="edit">Edit</button><button class="btn danger" data-act="del">Delete</button></div>`);
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    // Move up/down reorders the category and re-renders; the sheet stays open
    // (its actions are bound directly, not via data-action delegation).
    sheet.querySelector('[data-act="up"]').onclick = () => moveCategory(catId, -1);
    sheet.querySelector('[data-act="down"]').onclick = () => moveCategory(catId, 1);
    // Defer the swap (see the same note in openItemMenu): a synchronous
    // innerHTML swap on the tapped button leaves a ghost click that hits the
    // backdrop and closes the new sheet.
    sheet.querySelector('[data-act="edit"]').onclick = () => { setTimeout(() => { closeSheet(true); openEditCategory(catId); }, 0); };
    sheet.querySelector('[data-act="del"]').onclick = () => {
      // Destructive: open a confirmation sheet that states how many items will
      // be deleted (the category and all its items are removed together).
      setTimeout(() => { closeSheet(true); openDeleteCategory(catId); }, 0);
    };
  }

  function openDeleteCategory(catId) {
    const store = state.stores[state.activeStore];
    const cat = store && store.categories.find((c) => c.id === catId);
    if (!cat) return;
    const n = cat.items.length;
    const detail = n === 0 ? "It has no items." : `This will also delete its ${n} item${n > 1 ? "s" : ""}.`;
    openSheet("Delete category",
      `<p style="text-align:center;color:var(--text-2);margin:4px 0 8px">Delete <b>${esc(cat.name)}</b>?<br>${esc(detail)}</p>`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn danger" data-act="del">Delete</button></div>`);
    sheet.querySelector('[data-act="del"]').onclick = () => { deleteCategory(catId); closeSheet(); };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
  }

  function openEditCategory(catId) {
    const store = state.stores[state.activeStore];
    const cat = store && store.categories.find((c) => c.id === catId);
    if (!cat) return;
    openSheet("Edit category",
      `<input class="field" id="f" value="${esc(cat.name)}" placeholder="e.g. Frozen" maxlength="30" />`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Save</button></div>`);
    sheet.querySelector('[data-act="save"]').onclick = () => {
      const v = sheet.querySelector("#f").value.trim();
      if (v) renameCategory(catId, v);
      closeSheet();
    };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    sheet.querySelector("#f").onkeydown = (e) => { if (e.key === "Enter") sheet.querySelector('[data-act="save"]').click(); };
  }

  function openAddCategory() {
    openSheet("New category",
      `<input class="field" id="f" placeholder="e.g. Frozen" maxlength="30" />`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Create</button></div>`);
    sheet.querySelector('[data-act="save"]').onclick = () => {
      const v = sheet.querySelector("#f").value.trim();
      if (v) addCategory(v);
      closeSheet();
    };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    sheet.querySelector("#f").onkeydown = (e) => { if (e.key === "Enter") sheet.querySelector('[data-act="save"]').click(); };
  }

  function openAddStore() {
    openSheet("New store",
      `<input class="field" id="f" placeholder="e.g. Pharmacy" maxlength="30" />`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Create</button></div>`);
    sheet.querySelector('[data-act="save"]').onclick = () => {
      const v = sheet.querySelector("#f").value.trim();
      if (v) addStore(v);
      closeSheet();
    };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    sheet.querySelector("#f").onkeydown = (e) => { if (e.key === "Enter") sheet.querySelector('[data-act="save"]').click(); };
  }

  function openRenameStore(i) {
    openSheet("Rename store",
      `<input class="field" id="f" value="${esc(state.stores[i].name)}" maxlength="30" />`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Save</button></div>`);
    sheet.querySelector('[data-act="save"]').onclick = () => {
      const v = sheet.querySelector("#f").value.trim();
      if (v) renameStore(i, v);
      closeSheet();
    };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
    sheet.querySelector("#f").onkeydown = (e) => { if (e.key === "Enter") sheet.querySelector('[data-act="save"]').click(); };
  }

  function openDeleteStore(i) {
    const store = state.stores[i];
    if (!store) return;
    const name = store.name;
    const n = store.categories.reduce((sum, c) => sum + c.items.length, 0);
    const detail = n === 0 ? "It has no items." : `This will also delete its ${n} item${n > 1 ? "s" : ""}.`;
    openSheet("Delete store",
      `<p style="text-align:center;color:var(--text-2);margin:4px 0 8px">Delete <b>${esc(name)}</b>?<br>${esc(detail)}</p>`,
      `<div class="sheet-actions"><button class="btn" data-act="cancel">Cancel</button><button class="btn danger" data-act="del">Delete</button></div>`);
    sheet.querySelector('[data-act="del"]').onclick = () => { deleteStore(i); closeSheet(); };
    sheet.querySelector('[data-act="cancel"]').onclick = closeSheet;
  }

  // Renders the store rows (name + up/down reorder arrows + Rename/Delete) into
  // the Manage sheet's #store-rows container. Called on open and again after
  // each reorder so the rows (and their disabled states) refresh in place.
  function renderStoreRows() {
    const box = sheet.querySelector("#store-rows");
    if (!box) return;
    box.innerHTML = state.stores.map((s, i) => {
      const up = i > 0 ? "" : "disabled";
      const down = i < state.stores.length - 1 ? "" : "disabled";
      return `<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--separator)">
        <span class="store-move">
          <button data-mup="${i}" ${up} aria-label="Move ${esc(s.name)} up">${icon("arrowshape.up")}</button>
          <button data-mdn="${i}" ${down} aria-label="Move ${esc(s.name)} down">${icon("arrowshape.down")}</button>
        </span>
        <span style="flex:1;font-weight:600">${esc(s.name)}</span>
        <button class="list-send" data-mren="${i}">Rename</button>
        <button class="list-send" style="color:var(--danger)" data-mdel="${i}">Delete</button>
      </div>`;
    }).join("");
    box.querySelectorAll("[data-mren]").forEach((b) => b.onclick = () => { closeSheet(true); openRenameStore(+b.dataset.mren); });
    box.querySelectorAll("[data-mdel]").forEach((b) => b.onclick = () => { closeSheet(); openDeleteStore(+b.dataset.mdel); });
    box.querySelectorAll("[data-mup]").forEach((b) => b.onclick = () => moveStore(+b.dataset.mup, -1));
    box.querySelectorAll("[data-mdn]").forEach((b) => b.onclick = () => moveStore(+b.dataset.mdn, 1));
  }

  function openManageStores() {
    // Two labelled sections: the store list (STORES) and the backup actions
    // (BACKUP). Export/Import are normal outlined buttons, not text links.
    // The store rows live in #store-rows so renderStoreRows() can refresh them
    // in place after a reorder without rebuilding (and re-animating) the sheet.
    let rows = `<div class="sheet-section">Stores</div><div id="store-rows"></div>`;
    rows += `<div class="sheet-section">Appearance</div>${themeSegmented()}`;
    rows += `<div class="sheet-section">Backup</div>
      <div class="sheet-actions" style="margin-top:0">
        <button class="btn outline" data-mexp="1">Export</button>
        <button class="btn outline" data-mimp="1">Import</button>
      </div>`;
    openSheet("Settings", rows,
      `<div class="sheet-actions"><button class="btn primary" data-act="done">Done</button></div>
       <p class="sheet-footer">Shoplist v${APP_VERSION} · <a href="${REPO_URL}" target="_blank" rel="noopener">GitHub</a></p>`);
    renderStoreRows();
    sheet.querySelector("[data-mexp]").onclick = exportBackup;
    sheet.querySelector("[data-mimp]").onclick = () => importFile.click();
    sheet.querySelector('[data-act="done"]').onclick = closeSheet;
    // Appearance: pick a choice, persist it, and refresh the segmented control.
    sheet.querySelectorAll("[data-theme-choice]").forEach((b) => {
      b.onclick = () => { themeCtl.setChoice(b.dataset.themeChoice); updateThemeSegmented(); };
    });
  }

  // ---- backup: export / import ----
  // The whole app is one JSON blob in localStorage, so a backup is simply that
  // blob written to a file the user keeps somewhere safe, and a restore reads
  // it back. We wrap it in a versioned envelope so the file is self-describing
  // and can be validated (and future-proofed) on import.
  const BACKUP_APP = "shoplist";
  const BACKUP_VERSION = 1;
  const BACKUP_FILE = "shoplist-backup.json";

  function exportBackup() {
    const envelope = { app: BACKUP_APP, version: BACKUP_VERSION, data: state };
    const blob = new Blob([JSON.stringify(envelope, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = BACKUP_FILE;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoke on the next tick so the download has a chance to start.
    setTimeout(() => URL.revokeObjectURL(url), 0);
    toast("Backup downloaded");
  }

  // Validate a parsed envelope and return a normalized state, or null.
  function parseBackup(text) {
    let env;
    try { env = JSON.parse(text); } catch (e) { return null; }
    // Accept both the envelope and a bare state blob.
    const d = (env && env.app === BACKUP_APP) ? env.data : env;
    if (!d || !Array.isArray(d.stores)) return null;
    const s = {
      stores: d.stores,
      activeStore: (typeof d.activeStore === "number" && d.activeStore >= 0 && d.activeStore < d.stores.length) ? d.activeStore : 0,
      openCats: d.openCats || {},
      tab: d.tab || "list"
    };
    return s;
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const next = parseBackup(String(reader.result));
      if (!next) { toast("Not a valid backup file"); return; }
      if (!confirm("Replace your current stores with this backup? This will overwrite everything.")) return;
      state = next;
      query = "";
      searchInput.value = "";
      searchClear.classList.remove("show");
      save();
      render();
      closeSheet();
      toast("Backup restored");
    };
    reader.onerror = () => toast("Could not read file");
    reader.readAsText(file);
  }

  // ---- SMS ----
  function buildSMS() {
    // Send the items the user still needs to buy (selected, not yet purchased).
    const pending = storeItems().filter((i) => i.done && !i.purchased);
    if (!pending.length) { toast("Nothing to send yet"); return; }
    // Group into sections that follow the manual category order; items within
    // each section are A–Z. storeItems() is already category-ordered with items
    // sorted, so a single ordered pass keeps section order stable.
    const sections = [];
    const byCat = new Map();
    pending.forEach((i) => {
      const key = i.cat || "";
      if (!byCat.has(key)) { byCat.set(key, []); sections.push(key); }
      byCat.get(key).push(i);
    });
    const lines = sections.map((cat) => {
      const rows = byCat.get(cat).map((i) => `- ${i.name}${cat ? " (" + cat + ")" : ""}`);
      return rows.join("\n");
    }).join("\n");
    const storeName = state.stores[state.activeStore]?.name || "";
    // The list body only — the share sheet's `title` supplies the header, so
    // we don't repeat it in the text (which would show the title twice).
    const msg = lines;
    // Prefer the native share sheet when available; otherwise (or if the call
    // fails for any reason other than the user cancelling) fall back to the
    // SMS/Copy sheet. The message text is identical in both paths.
    if (navigator.share) {
      shareList({ title: `Shopping list - ${storeName}`, text: msg }, pending.length);
    } else {
      openSMSSheet(msg, pending.length);
    }
  }

  // Opens the native share sheet, attaching the cart card image when the
  // platform supports it (so the OS shows our icon instead of the default
  // text-file glyph). Any failure other than the user dismissing the sheet
  // falls back to the SMS/Copy sheet.
  function shareList(data, count) {
    loadShareImage()
      .then((file) => {
        if (file && navigator.canShare && navigator.canShare({ ...data, files: [file] })) {
          data.files = [file];
        }
        return navigator.share(data);
      })
      .catch((err) => {
        if (err && err.name === "AbortError") return; // user dismissed it
        openSMSSheet(data.text, count);
      });
  }

  // The cart card shown in the share sheet (icons/share-card.png). Cached so
  // the fetch happens once per session; resolves to null if it can't load.
  let shareFilePromise = null;
  function loadShareImage() {
    if (!shareFilePromise) {
      shareFilePromise = fetch("icons/share-card.png")
        .then((r) => (r.ok ? r.blob() : null))
        .then((b) => (b ? new File([b], "shopping-list.png", { type: b.type || "image/png" }) : null))
        .catch(() => null);
    }
    return shareFilePromise;
  }

  // The SMS/Copy fallback sheet: shows the list in a textarea with Copy and
  // Send (opens the carrier's messaging app) actions.
  function openSMSSheet(msg, count) {
    openSheet("Text list via SMS",
      `<p style="text-align:center;color:var(--text-2);font-size:13px;margin-bottom:10px">${count} item${count > 1 ? "s" : ""} · tap to send via your carrier</p>
       <textarea class="field" id="f" rows="6" readonly>${esc(msg)}</textarea>`,
      `<div class="sheet-actions"><button class="btn" data-act="copy">Copy</button><button class="btn primary" data-act="send">Send</button></div>`);
    const enc = encodeURIComponent(msg);
    sheet.querySelector('[data-act="send"]').onclick = () => {
      window.location.href = "sms:?&body=" + enc;
      closeSheet();
    };
    sheet.querySelector('[data-act="copy"]').onclick = () => {
      const ta = sheet.querySelector("#f");
      ta.select();
      try { document.execCommand("copy"); toast("Copied list"); } catch (e) { toast("Copy failed"); }
    };
    backdrop.classList.add("show");
  }

  // ---- event wiring ----
  // content clicks (delegated)
  contentEl.addEventListener("click", (e) => {
    const t = e.target.closest("[data-toggle],[data-del],[data-itemmenu],[data-catmenu],[data-edititem],[data-togglecat],[data-additem],[data-addcat],[data-editcat],[data-delcat],[data-sendall],[data-clear]");
    if (!t) return;
    if (t.dataset.toggle !== undefined) { toggleItem(t.dataset.toggle, state.tab); }
    else if (t.dataset.del !== undefined) { deleteItem(t.dataset.del, state.tab); }
    else if (t.dataset.itemmenu !== undefined) { openItemMenu(t.dataset.itemmenu); }
    else if (t.dataset.catmenu !== undefined) { openCategoryMenu(t.dataset.catmenu); }
    else if (t.dataset.edititem !== undefined) { openEditItem(t.dataset.edititem); }
    else if (t.dataset.clear !== undefined) clearPurchased();
    else if (t.dataset.togglecat !== undefined) { state.openCats[t.dataset.togglecat] = !(state.openCats[t.dataset.togglecat] !== false); render(); }
    else if (t.dataset.additem !== undefined) openAddItem(t.dataset.additem);
    else if (t.dataset.addcat !== undefined) openAddCategory();
    else if (t.dataset.editcat !== undefined) openEditCategory(t.dataset.editcat);
    else if (t.dataset.delcat !== undefined) deleteCategory(t.dataset.delcat);
    else if (t.dataset.sendall !== undefined) buildSMS();
  });

  // stores row clicks (delegated)
  storesEl.addEventListener("click", (e) => {
    const t = e.target.closest("[data-store],[data-addstore],[data-storemenu],[data-manage]");
    if (!t) return;
    if (t.dataset.storemenu !== undefined) { openManageStores(); }
    else if (t.dataset.manage !== undefined) { openManageStores(); }
    else if (t.dataset.store !== undefined) { state.activeStore = +t.dataset.store; render(); }
    else if (t.dataset.addstore !== undefined) openAddStore();
  });

  // search (Stores tab only)
  searchBtn.addEventListener("click", () => {
    if (state.tab !== "stores") { state.tab = "stores"; render(); }
    searchInput.focus();
  });
  searchInput.addEventListener("input", () => {
    query = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle("show", query.length > 0);
    render();
  });
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { searchInput.value = ""; query = ""; searchClear.classList.remove("show"); render(); }
  });
  searchClear.addEventListener("click", () => {
    searchInput.value = ""; query = ""; searchClear.classList.remove("show"); searchInput.focus(); render();
  });

  // backup import: the hidden file input is triggered from the Manage sheet.
  importFile.addEventListener("change", () => {
    if (importFile.files && importFile.files[0]) importBackup(importFile.files[0]);
    importFile.value = ""; // allow re-importing the same file
  });

  // backdrop closes sheet — but only when the tap is *on the backdrop itself*.
  // Clicks on the sheet (or its buttons) bubble up to the backdrop; without this
  // guard a click that lands on a button after a sheet swap would close the sheet.
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });
  // escape closes
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  // tabs
  tabs.forEach((t) => t.addEventListener("click", () => { state.tab = t.dataset.tab; render(); }));

  // ---- init ----
  render();

  // service worker (register on load; ignore unsupported/offline contexts)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
